name: localvpn
description: "LocalVPN - Virtual LAN over the Internet"
publish_to: 'none'
version: 1.0.38+39

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  connectivity_plus: ^6.0.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.2.0
  file_picker: ^8.0.0
  open_file: ^3.5.0
  package_info_plus: ^8.0.0
  audioplayers: ^6.1.0
  wireguard_flutter_plus: ^1.0.4
  mobile_scanner: ^6.0.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.webp
    - assets/splash_logo.webp
    - assets/m3/
    - assets/m3/icons/

  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Kanit-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Kanit-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-Regular.ttf
          weight: 400
        - asset: assets/fonts/Anuphan-Medium.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
